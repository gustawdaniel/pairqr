name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-universal:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/pairqr \
            target/aarch64-apple-darwin/release/pairqr \
            -output target/universal-apple-darwin/release/pairqr

      - name: Package macOS Universal
        run: |
          cd target/universal-apple-darwin/release
          tar -czvf ../../../pairqr-macos-universal.tar.gz pairqr

      - name: Upload macOS Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairqr-macos-universal
          path: pairqr-macos-universal.tar.gz

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/pairqr.exe -DestinationPath pairqr-windows-${{ matrix.arch }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairqr-windows-${{ matrix.arch }}
          path: pairqr-windows-${{ matrix.arch }}.zip

  release:
    name: Create Release
    needs: [build-macos-universal, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/pairqr-macos-universal/pairqr-macos-universal.tar.gz
            artifacts/pairqr-windows-x64/pairqr-windows-x64.zip
            artifacts/pairqr-windows-x86/pairqr-windows-x86.zip
          generate_release_notes: true
