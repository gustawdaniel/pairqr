name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-universal:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/x86_64-apple-darwin/release/pairqr \
            target/aarch64-apple-darwin/release/pairqr \
            -output target/universal-apple-darwin/release/pairqr

      - name: Package macOS Universal
        run: |
          cd target/universal-apple-darwin/release
          tar -czvf ../../../pairqr-macos-universal.tar.gz pairqr

      - name: Upload macOS Universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairqr-macos-universal
          path: pairqr-macos-universal.tar.gz

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # x86 family
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: i686
            target: i686-unknown-linux-musl
          # ARM family
          - arch: aarch64
            target: aarch64-unknown-linux-musl
          - arch: armv7
            target: armv7-unknown-linux-musleabihf
          - arch: armv7-hf
            target: armv7-unknown-linux-musleabi
          - arch: arm
            target: arm-unknown-linux-musleabi
          - arch: armv5te
            target: armv5te-unknown-linux-musleabi
          - arch: thumbv7neon
            target: thumbv7neon-unknown-linux-musleabihf
          # MIPS family
          - arch: mips
            target: mips-unknown-linux-musl
          - arch: mipsel
            target: mipsel-unknown-linux-musl
          - arch: mips64
            target: mips64-unknown-linux-muslabi64
          - arch: mips64el
            target: mips64el-unknown-linux-muslabi64
          # PowerPC family
          - arch: powerpc
            target: powerpc-unknown-linux-gnu
          - arch: powerpc64
            target: powerpc64-unknown-linux-gnu
          - arch: powerpc64le
            target: powerpc64le-unknown-linux-gnu
          # RISC-V
          - arch: riscv64
            target: riscv64gc-unknown-linux-gnu
          # IBM Z
          - arch: s390x
            target: s390x-unknown-linux-gnu
          # SPARC
          - arch: sparc64
            target: sparc64-unknown-linux-gnu
          # LoongArch
          - arch: loongarch64
            target: loongarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package Linux
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../pairqr-linux-${{ matrix.arch }}.tar.gz pairqr

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairqr-linux-${{ matrix.arch }}
          path: pairqr-linux-${{ matrix.arch }}.tar.gz

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/pairqr.exe -DestinationPath pairqr-windows-${{ matrix.arch }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pairqr-windows-${{ matrix.arch }}
          path: pairqr-windows-${{ matrix.arch }}.zip

  release:
    name: Create Release
    needs: [build-macos-universal, build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/pairqr-macos-universal/pairqr-macos-universal.tar.gz
            artifacts/pairqr-linux-x86_64/pairqr-linux-x86_64.tar.gz
            artifacts/pairqr-linux-i686/pairqr-linux-i686.tar.gz
            artifacts/pairqr-linux-aarch64/pairqr-linux-aarch64.tar.gz
            artifacts/pairqr-linux-armv7/pairqr-linux-armv7.tar.gz
            artifacts/pairqr-linux-armv7-hf/pairqr-linux-armv7-hf.tar.gz
            artifacts/pairqr-linux-arm/pairqr-linux-arm.tar.gz
            artifacts/pairqr-linux-armv5te/pairqr-linux-armv5te.tar.gz
            artifacts/pairqr-linux-thumbv7neon/pairqr-linux-thumbv7neon.tar.gz
            artifacts/pairqr-linux-mips/pairqr-linux-mips.tar.gz
            artifacts/pairqr-linux-mipsel/pairqr-linux-mipsel.tar.gz
            artifacts/pairqr-linux-mips64/pairqr-linux-mips64.tar.gz
            artifacts/pairqr-linux-mips64el/pairqr-linux-mips64el.tar.gz
            artifacts/pairqr-linux-powerpc/pairqr-linux-powerpc.tar.gz
            artifacts/pairqr-linux-powerpc64/pairqr-linux-powerpc64.tar.gz
            artifacts/pairqr-linux-powerpc64le/pairqr-linux-powerpc64le.tar.gz
            artifacts/pairqr-linux-riscv64/pairqr-linux-riscv64.tar.gz
            artifacts/pairqr-linux-s390x/pairqr-linux-s390x.tar.gz
            artifacts/pairqr-linux-sparc64/pairqr-linux-sparc64.tar.gz
            artifacts/pairqr-linux-loongarch64/pairqr-linux-loongarch64.tar.gz
            artifacts/pairqr-windows-x64/pairqr-windows-x64.zip
            artifacts/pairqr-windows-x86/pairqr-windows-x86.zip
          generate_release_notes: true
